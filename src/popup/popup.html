<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8" />
    <title>CheckGPT</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <h3>CheckGPT</h3>

    <div class="toggle-row">
        <span>Heute</span>

        <label class="switch">
            <input type="checkbox" aria-label="Zeitraum umschalten zwischen Heute und Immer" checked />
            <span class="slider"></span>
        </label>

        <span>Immer</span>
    </div>

    <div class="chips">
        <span class="chip">
            <strong id="stat-prompts">3</strong> Prompts geschickt
        </span>

        <span class="chip">
            <strong id="stat-energy">3,56 Wattstunden</strong> verbraucht
        </span>

        <span class="chip">
            <strong id="stat-co2">2 CO2e</strong> verursacht
        </span>
    </div>

    <div class="hint">Das ist etwa wie:</div>

    <div class="comparison-grid">
        <div class="chip comparison-item smartphone">
            <strong id="stat-smartphone">0</strong> Smartphones geladen
        </div>

        <div class="chip comparison-item car">
            <strong id="stat-car">0 m</strong> Gefahrene Kilometer (km)
        </div>

        <div class="chip comparison-item footprint">
            <strong id="stat-footprint">0%</strong> des verträglichen, täglichen CO2-Fußabdrucks
        </div>
    </div>

    <div class="footer-link">
        <a href="https://github.com/Gula1507/checkGPT/wiki/2.-Berechnungsmethodik" target="_blank">Unsere
            Berechnungsmethodik</a>
    </div>
    <script type="module" src="popup.js"></script>
</body>

</html>
