<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <title>CheckGPT</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
<h3>CheckGPT</h3>

<div class="toggle-row">
    <span>Heute</span>

    <label class="switch">
        <input
                type="checkbox"
                aria-label="Zeitraum umschalten zwischen Heute und Immer"
                checked
        />
        <span class="slider"></span>
    </label>

    <span>Immer</span>
</div>

<div class="chips">
    <span class="chip"><strong>3</strong> Prompts geschickt</span>
    <span class="chip">
        <strong>3,56 Wattstunden</strong><br>
        verbraucht
    </span>
</div>

<div class="hint">Das ist etwa wie:</div>

<span class="chip single-row"><strong>5 m</strong> Auto fahren</span>
<script type="module" src="popup.js"></script>
</body>
</html>
