<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8" />
    <title>CheckGPT</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <h3>CheckGPT</h3>

    <div class="toggle-row">
        <span>Heute</span>

        <label class="switch">
            <input type="checkbox" aria-label="Zeitraum umschalten zwischen Heute und Immer" checked />
            <span class="slider"></span>
        </label>

        <span>Immer</span>
    </div>

    <div class="chips">
        <span class="chip">
            <strong>3</strong> Prompts geschickt
        </span>

        <span class="chip">
            <strong>3,56 Wattstunden</strong> verbraucht
        </span>
    </div>

    <div class="hint">Das ist etwa wie:</div>

    <div class="comparison-grid">
        <div class="chip comparison-item car">
            <strong>5 m</strong> Auto fahren
        </div>
        <div class="chip comparison-item bulb">
            <strong>1 h</strong> LED Licht
        </div>
        <div class="chip comparison-item smartphone">
            <strong>10%</strong> Handy laden
        </div>
        <div class="chip comparison-item tea">
            <strong>1</strong> Tasse Tee
        </div>
    </div>
    <script type="module" src="popup.js"></script>
</body>

</html>
