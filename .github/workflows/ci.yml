name: CI

on:
  pull_request:
  push:
    branches: [ test, main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build add-on
        if: github.base_ref == 'main'
        run: npm run build

      - name: Upload build artifact
        if: github.base_ref == 'main'
        uses: actions/upload-artifact@v4
        with:
          name: addon-dist
          path: dist/
